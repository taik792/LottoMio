<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Intelligence</title>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #131d38;
            --accent-blue: #007bff;
            --accent-green: #00c853;
            --accent-orange: #ff9100;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #1f2d52;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: #0066ff;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-text h1 {
            font-size: 1.4rem;
            margin: 0;
        }

        .brand-text p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 2px 0 0 0;
        }

        .version-tag {
            background: #1e2c4d;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            color: #4da6ff;
        }

        .info-header {
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid #1c2b4e;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .ruota-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ruota-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 2px;
        }

        .badge-calc {
            background: #1c2b4d;
            border: 1px solid #2a3e6e;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            color: #64b5f6;
        }

        .numbers-extracted {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .num-extracted-ball {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #0f172a;
            border: 1px solid #2a3a5e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .play-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #1a2744;
        }

        .play-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .ball {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            color: #fff;
        }

        .ball-blue { background: var(--accent-blue); }
        .ball-green { background: var(--accent-green); }
        .ball-orange { background: var(--accent-orange); }

        .balls-group {
            display: flex;
            gap: 6px;
        }

        .history-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #1c2b4e;
        }

        .history-title-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.85rem;
        }

        th {
            color: var(--text-muted);
            padding: 10px;
            border-bottom: 1px solid #1c2b4e;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #15223d;
        }

        .badge-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .status-win-ambo { background: rgba(0, 200, 83, 0.2); color: #00e676; border: 1px solid #00c853; }
        .status-win-ambata { background: rgba(0, 123, 255, 0.2); color: #40c4ff; border: 1px solid #007bff; }
        .status-ingioco { background: rgba(255, 145, 0, 0.2); color: #ffab40; border: 1px solid #ff9100; }
        .status-closed { background: rgba(255, 23, 68, 0.2); color: #ff5252; border: 1px solid #ff1744; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">
            <div class="logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <div class="brand-text">
                <h1>Lotto Intelligence <span class="version-tag" id="ver-tag">v9.0</span></h1>
                <p id="sub-title">Algoritmo Sommativo Multi-Ruota Dinamico</p>
            </div>
        </div>
        <div class="info-header">
            <div id="info-num" style="font-weight: bold; color: #fff;">Lotto Intelligence V9.0</div>
            <div id="info-date">Aggiornato al: --/--/----</div>
        </div>
    </header>

    <div class="cards-grid" id="cards-container"></div>

    <div class="history-section">
        <div class="history-title-box">
            <div>
                <h3 style="margin: 0;">Storico Verificato ed Esiti</h3>
                <span style="font-size: 0.8rem; color: var(--text-muted);">Verifica retrospettiva sulle ultime estrazioni elaborate</span>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Riferimento Concorso</th>
                    <th>Ambata Capogioco</th>
                    <th>Ambo Secco</th>
                    <th>Colpo / Stato</th>
                    <th>Esito Elaborato</th>
                </tr>
            </thead>
            <tbody id="history-tbody"></tbody>
        </table>
    </div>
</div>

<script>
    async function caricaDati() {
        try {
            const response = await fetch('risultati_v4.json?v=' + new Date().getTime());
            const data = await response.json();

            if (data.info_concorso) {
                document.getElementById('info-num').innerText = data.info_concorso.numero || 'Lotto Intelligence V9.0';
                document.getElementById('info-date').innerText = 'Aggiornato al: ' + (data.info_concorso.data || '');
            }

            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            if (data.previsioni) {
                Object.keys(data.previsioni).forEach(ruota => {
                    const prev = data.previsioni[ruota];
                    
                    let extractedHtml = '';
                    if (prev.numeri_estrazione) {
                        extractedHtml = prev.numeri_estrazione.map(n => `<div class="num-extracted-ball">${n}</div>`).join('');
                    }

                    let ambettiHtml = '';
                    if (prev.ambetti) {
                        ambettiHtml = prev.ambetti.map(pair => 
                            `<div class="balls-group"><div class="ball ball-orange">${pair[0]}</div><div class="ball ball-orange">${pair[1]}</div></div>`
                        ).join('');
                    }

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div>
                                <div class="ruota-title">Ruota di Giocata</div>
                                <div class="ruota-name">${ruota}</div>
                            </div>
                            <div class="badge-calc">${prev.tipo_calcolo}</div>
                        </div>
                        <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px;">Ultima estrazione base:</div>
                        <div class="numbers-extracted">${extractedHtml}</div>
                        <div class="play-row">
                            <span class="play-label">Ambata Principale:</span>
                            <div class="ball ball-blue">${prev.ambata}</div>
                        </div>
                        <div class="play-row">
                            <span class="play-label">Ambo Secco Principale:</span>
                            <div class="balls-group">
                                <div class="ball ball-green">${prev.ambo[0]}</div>
                                <div class="ball ball-green">${prev.ambo[1]}</div>
                            </div>
                        </div>
                        <div class="play-row">
                            <span class="play-label">Ambetti Aggiuntivi:</span>
                            <div style="display: flex; gap: 10px;">${ambettiHtml}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            const tbody = document.getElementById('history-tbody');
            tbody.innerHTML = '';

            if (data.storico_verificato) {
                data.storico_verificato.forEach(row => {
                    let badgeClass = 'status-ingioco';
                    if (row.stato.includes('AMBO')) badgeClass = 'status-win-ambo';
                    else if (row.stato.includes('Ambata')) badgeClass = 'status-win-ambata';
                    else if (row.stato.includes('concluso') || row.stato.includes('Chiuso')) badgeClass = 'status-closed';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="color: var(--text-muted); font-weight: bold;">${row.data}</td>
                        <td style="color: #4da6ff; font-weight: bold;">${row.ambata}</td>
                        <td style="color: #00e676; font-weight: bold;">${row.ambo}</td>
                        <td>${row.colpi}</td>
                        <td><span class="badge-status ${badgeClass}">${row.stato}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

        } catch (e) {
            console.error("Errore nel caricamento del file JSON:", e);
        }
    }

    caricaDati();
</script>
</body>
</html>
