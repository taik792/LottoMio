<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronostici Lotto - Motore Isotopo & Cadenze</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121826;
            color: #e0e6ed;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 2em;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #00d2ff;
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: #1b2434;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            padding: 24px;
            border-left: 6px solid #00d2ff;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2c3b52;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .ruote-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .colpo-badge {
            font-size: 0.85em;
            color: #ffb703;
            margin-top: 4px;
            font-weight: bold;
        }
        .motivo-badge {
            background: #2a384e;
            color: #00d2ff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .pronostico-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .box-giocata {
            background: #101622;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #2a374a;
            text-align: center;
        }
        .box-title {
            font-size: 0.85em;
            color: #8a99ad;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .number-badge {
            display: inline-block;
            background: #00d2ff;
            color: #0f172a;
            font-size: 1.3em;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 6px;
            margin: 2px;
        }
        .number-badge.gold {
            background: #ffb703;
        }
        #loading {
            text-align: center;
            font-size: 1.2em;
            color: #8a99ad;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <h1>🎯 PREVISIONI ISOTOPE & CADENZE</h1>
    <div class="subtitle">Inseguimento statistico dinamico (Max 6 Colpi)</div>

    <div id="loading">Caricamento previsioni attive in corso...</div>
    <div class="container" id="previsioni-container"></div>

    <script>
        fetch('risultati_v4.json')
            .then(response => {
                if (!response.ok) throw new Error('Impossibile caricare risultati_v4.json');
                return response.json();
            })
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                const container = document.getElementById('previsioni-container');

                if (!data.previsioni_top || data.previsioni_top.length === 0) {
                    container.innerHTML = '<div style="text-align:center; color:#ffb703;">Nessuna previsione attiva al momento.</div>';
                    return;
                }

                data.previsioni_top.forEach(prev => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    const amboHTML = prev.ambo.map(n => `<span class="number-badge">${n}</span>`).join(' ');
                    const quartinaHTML = prev.quartina.map(n => `<span class="number-badge gold">${n}</span>`).join(' ');

                    card.innerHTML = `
                        <div class="card-header">
                            <div>
                                <div class="ruote-title">📍 ${prev.ruota_principale} - ${prev.ruota_secondaria}</div>
                                <div class="colpo-badge">⏱️ Colpo di gioco: <strong>${prev.colpo_attuale} di 6</strong></div>
                            </div>
                            <div class="motivo-badge">${prev.motivo}</div>
                        </div>
                        <div class="pronostico-grid">
                            <div class="box-giocata">
                                <div class="box-title">Ambata Secca</div>
                                <span class="number-badge">${prev.ambata}</span>
                            </div>
                            <div class="box-giocata">
                                <div class="box-title">Ambo Secco</div>
                                ${amboHTML}
                            </div>
                            <div class="box-giocata">
                                <div class="box-title">Terno / Quartina</div>
                                ${quartinaHTML}
                            </div>
                        </div>
                    `;

                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error(error);
                document.getElementById('loading').innerHTML = `❌ Errore durante il caricamento dei dati.<br><small>${error.message}</small>`;
            });
    </script>
</body>
</html>
