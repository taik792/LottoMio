<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiche e Pronostici Lotto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #1a252f;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        .ruota-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            width: 320px;
            border-top: 5px solid #3498db;
        }
        .ruota-card h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 8px;
            text-transform: uppercase;
        }
        .info {
            font-size: 0.85em;
            color: #7f8c8d;
            margin-bottom: 12px;
        }
        /* Box Pronostico */
        .pronostico-box {
            background-color: #fff8e1;
            border: 1px solid #ffe082;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .pronostico-title {
            font-weight: bold;
            color: #d84315;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .pronostico-item {
            font-size: 0.95em;
            margin-bottom: 4px;
        }
        .num-badge {
            background: #d84315;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        /* Liste statistiche */
        .section-title {
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #2c3e50;
            font-size: 0.9em;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 4px 8px;
            background: #f8f9fa;
            margin-bottom: 3px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
        }
        .badge-freq { background-color: #2ecc71; color: white; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
        .badge-rit { background-color: #e74c3c; color: white; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
        #loading { text-align: center; font-size: 1.2em; color: #7f8c8d; }
    </style>
</head>
<body>

    <h1>Statistiche & Pronostici Lotto</h1>
    <div id="loading">Caricamento dati in corso...</div>
    <div class="container" id="ruote-container"></div>

    <script>
        fetch('risultati_v4.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                const container = document.getElementById('ruote-container');

                for (const [ruota, info] of Object.entries(data)) {
                    const card = document.createElement('div');
                    card.className = 'ruota-card';

                    const freqList = info.top_frequenti.map(item => 
                        `<li><span>Numero <strong>${item.numero}</strong></span> <span class="badge-freq">${item.frequenza}v</span></li>`
                    ).join('');

                    const ritList = info.top_ritardatari.map(item => 
                        `<li><span>Numero <strong>${item.numero}</strong></span> <span class="badge-rit">${item.ritardo}r</span></li>`
                    ).join('');

                    // Sezione Consiglio Gioco
                    const cons = info.consiglio_gioco;
                    const consiglioHTML = cons ? `
                        <div class="pronostico-box">
                            <div class="pronostico-title">🎯 Consigli di Gioco</div>
                            <div class="pronostico-item"><strong>Ambata:</strong> <span class="num-badge">${cons.ambata}</span></div>
                            <div class="pronostico-item"><strong>Ambo:</strong> ${cons.ambo.join(' - ')}</div>
                            <div class="pronostico-item"><strong>Quartina:</strong> ${cons.quartina.join(' - ')}</div>
                        </div>
                    ` : '';

                    card.innerHTML = `
                        <h2>${ruota}</h2>
                        <div class="info">Estrazioni analizzate: ${info.totale_estrazioni_analizzate}</div>
                        ${consiglioHTML}
                        <div class="section-title">🔥 Top 5 Frequenti</div>
                        <ul>${freqList}</ul>
                        <div class="section-title">⏳ Top 5 Ritardatari</div>
                        <ul>${ritList}</ul>
                    `;

                    container.appendChild(card);
                }
            })
            .catch(error => {
                document.getElementById('loading').innerHTML = `❌ Errore durante il caricamento dati.`;
            });
    </script>
</body>
</html>
