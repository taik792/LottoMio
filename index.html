<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiche Estrazioni Lotto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #1a252f;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        .ruota-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            width: 300px;
            border-top: 5px solid #3498db;
        }
        .ruota-card h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 8px;
            text-transform: uppercase;
        }
        .info {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-bottom: 15px;
        }
        .section-title {
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 6px 10px;
            background: #f8f9fa;
            margin-bottom: 4px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }
        .badge-freq {
            background-color: #2ecc71;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        .badge-rit {
            background-color: #e74c3c;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        #loading {
            text-align: center;
            font-size: 1.2em;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <h1>Statistiche Estrazioni Lotto</h1>
    <div id="loading">Caricamento dati in corso...</div>
    <div class="container" id="ruote-container"></div>

    <script>
        // Si collega al file risultati_v4.json generato dallo script Python
        fetch('risultati_v4.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Impossibile caricare il file risultati_v4.json');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                const container = document.getElementById('ruote-container');

                // Scorre ciascuna ruota presente nel file JSON
                for (const [ruota, info] of Object.entries(data)) {
                    const card = document.createElement('div');
                    card.className = 'ruota-card';

                    // Genera i punti lista per i Top Frequenti
                    const freqList = info.top_frequenti.map(item => 
                        `<li><span>Numero <strong>${item.numero}</strong></span> <span class="badge-freq">${item.frequenza} volte</span></li>`
                    ).join('');

                    // Genera i punti lista per i Top Ritardatari
                    const ritList = info.top_ritardatari.map(item => 
                        `<li><span>Numero <strong>${item.numero}</strong></span> <span class="badge-rit">${item.ritardo} rit.</span></li>`
                    ).join('');

                    // Inserisce il contenuto HTML della scheda ruota
                    card.innerHTML = `
                        <h2>${ruota}</h2>
                        <div class="info">Estrazioni analizzate: <strong>${info.totale_estrazioni_analizzate}</strong></div>
                        
                        <div class="section-title">🔥 Top 5 Frequenti</div>
                        <ul>${freqList}</ul>
                        
                        <div class="section-title">⏳ Top 5 Ritardatari</div>
                        <ul>${ritList}</ul>
                    `;

                    container.appendChild(card);
                }
            })
            .catch(error => {
                console.error('Errore:', error);
                document.getElementById('loading').innerHTML = `❌ Errore durante il caricamento dei dati.<br><small>${error.message}</small>`;
            });
    </script>
</body>
</html>
