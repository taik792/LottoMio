name: 🚀 Lotto Intelligence Aggiorna Dashboard

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-lotto:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Esegui Solo Genera Risultati
      run: |
        if [ -f genera_risultati.py ]; then
          python genera_risultati.py
        fi

    - name: Salva e Pubblica su GitHub Pages
      run: |
        git config --global user.name "LottoActionsBot"
        git config --global user.email "lottoactionsbot@github.com"
        git add risultati_v4.json
        git diff-index --quiet HEAD || git commit -m "🤖 Dashboard: Avanzamento colpi ed estrazioni"
        git push || echo "Nessuna modifica da inviare o push non riuscito"
