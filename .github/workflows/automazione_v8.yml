name: Lotto Intelligence Automazione V8

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-lotto:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Esegui Elaborazione Dati
      run: |
       
        if [ -f test_ruote_top5.py ]; then
          python test_ruote_top5.py
        fi
        if [ -f test_distribuzione.py ]; then
          python test_distribuzione.py
        fi
    - name: Salva e Pubblica su GitHub Pages / index.html
      run: |
        git config --global user.name "LottoActionsBot"
        git config --global user.email "lottoactionsbot@github.com"
        git add risultati_v4.json
        git diff-index --quiet HEAD || git commit -m "🤖 Lotto Intelligence V8: Avanzamento automatico colpi"
        git push || echo "Nessuna modifica da inviare o push non riuscito"
