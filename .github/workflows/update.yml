name: Lotto Bot V4

on:
  schedule:
    - cron: "*/30 * * * *" # Ogni 30 minuti
  workflow_dispatch: # Permette l'avvio manuale

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per fare il push dell'archivio aggiornato
    steps:
      - name: Clona repository
        uses: actions/checkout@v3

      - name: Installa Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Esegui algoritmo
        run: python main.py

      - name: Commit risultati e archivio colpi
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add risultati_v4.json archivio_previsioni.json
          git commit -m "Auto-update risultati V4 e archivio colpi [skip ci]" || echo "Nessuna modifica da salvare"
          git push
