name: Esegui Super Ottimizzatore 

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Ti permette di avviare il test manualmente con un clic

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    # 🟢 PERMESSO CRITICO: Consente a GitHub Actions di salvare i file modificati
    permissions:
      contents: write

    steps:
    - name: Cambia codice sorgente
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Esegui Motore e Ottimizzatore V8
      run: |
        if [ -f genera_risultati.py ]; then
          python genera_risultati.py
          python super_ottimizzatore.py
        else
          echo "Errore: Il file genera_risultati.py non esiste nella repository!"
          exit 1
        fi

    - name: Autocommit e Push dei risultati aggiornati
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Configurazione con il bot ufficiale di GitHub Actions
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add risultati_v4.json
        
        # Esegue il commit solo se il file risultati_v4.json è effettivamente cambiato
        if ! git diff --cached --quiet; then
          git commit -m "🤖 Aggiornamento automatico risultati_v4.json [Fascia d'Oro]"
          git push origin HEAD:${{ github.ref }}
        else
          echo "Nessuna modifica rilevata in risultati_v4.json, salto il push."
        fi
