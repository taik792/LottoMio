name: Lotto Intelligence - Pipeline & Backtest

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions

jobs:
  run-lotto-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repository
        uses: actions/checkout@v4

      - name: Configurazione Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. Esegue il backtest per calcolare le combinazioni migliori
      - name: Esecuzione Backtest Fissi
        run: python backtest.py

      # 2. Esegue lo script principale per aggiornare le previsioni
      - name: Generazione Risultati JSON
        run: |
          if [ -f "main.py" ]; then
            python main.py
          elif [ -f "script.py" ]; then
            python script.py
          fi

      # 3. Salva i file aggiornati nel repository
      - name: Commit e Push dei File Generati
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto-update: Backtest ed Elaborazione Previsioni" || exit 0
          git push
