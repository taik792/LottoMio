name: Lotto Intelligence - Pipeline & Backtest

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 20 * * 2,4,5,6'
  workflow_dispatch:

jobs:
  run-lotto-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repository
        uses: actions/checkout@v4

      - name: Configurazione Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. Esegue il backtest
      - name: Esecuzione Backtest Fissi
        run: python backtest.py

      # 2. Esegue lo script principale di calcolo
      - name: Generazione Risultati JSON
        run: python genera_risultati.py

      # 3. Salva e pubblica i file aggiornati
      - name: Commit e Push dei File Generati
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto-update: Previsioni e Backtest v8.1" || exit 0
          git push
