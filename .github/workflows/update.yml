name: Esegui SuperLotto

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Ti permette di avviare il test manualmente con un clic

# PERMESSI CRUCIALI: Diamo a GitHub il potere di salvare e modificare i file nella repository
permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
    - name: Cambia codice sorgente
      uses: actions/checkout@v4
      with:
        persist-credentials: true # Mantiene le credenziali per salvare i dati

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Esegui Motore e Ottimizzatore V8
      run: |
        if [ -f genera_risultati.py ]; then
          python genera_risultati.py
          python super_ottimizzatore.py
        else
          echo "Errore: Il file genera_risultati.py non esiste nella repository!"
          exit 1
        fi

    # STEP DI SVOLTA: Prende risultati_v4.json e lo scrive permanentemente su GitHub
    - name: Salva e pubblica i risultati aggiornati
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add risultati_v4.json classifica_super_ottimizzatore.json
        # Esegue il commit solo se ci sono modifiche reali per evitare errori
        git diff-index --quiet HEAD || git commit -m "🤖 Aggiornamento automatico estrazioni e colpi [Fascia d'Oro]"
        git push
